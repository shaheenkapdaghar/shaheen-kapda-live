<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaheen Kapda Ghar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        #sidebar {
            width: 16rem;
            transition: width 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        #sidebar.sidebar-collapsed {
            width: 4rem;
        }
        .sidebar-text {
            transition: opacity 200ms ease-in-out;
            opacity: 1;
            white-space: nowrap; 
        }
        #sidebar.sidebar-collapsed .sidebar-text {
            opacity: 0;
            pointer-events: none;
            position: absolute; 
            visibility: hidden;
        }
        .bg-cf-black { background-color: #000000; }
        .border-cf-dark { border-color: #333333; }
        .tooltip {
            visibility: hidden;
            background-color: white;
            color: black;
            text-align: center;
            border-radius: 6px;
            padding: 4px 10px;
            position: absolute;
            z-index: 50;
            left: 110%;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e5e7eb;
            white-space: nowrap;
            pointer-events: none;
        }
        #sidebar.sidebar-collapsed .toggle-container:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
        .tooltip::after {
            content: "";
            position: absolute;
            top: 50%;
            right: 100%;
            margin-top: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: transparent white transparent transparent;
        }
    </style>
</head>
<body class="text-gray-800 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="bg-cf-black border-r border-cf-dark flex flex-col z-20 flex-shrink-0 text-white relative">
        <div class="h-16 flex items-center px-4 border-b border-cf-dark w-full overflow-hidden relative">
            <div class="h-8 w-8 rounded flex items-center justify-center bg-black flex-shrink-0 z-10">
                 <img src="https://i.ibb.co/DftDQgGM/IMG-6937.jpg" alt="Logo" class="h-full w-full object-cover rounded">
            </div>
            <span class="ml-3 font-semibold text-sm sidebar-text">Shaheen Kapda Ghar</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 overflow-x-hidden">
            <p class="px-5 text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-3 sidebar-text">Categories</p>
            <ul id="categoryList" class="space-y-1"></ul>
        </nav>
        <div class="border-t border-cf-dark p-2 flex items-center justify-start relative toggle-container">
            <button onclick="toggleSidebar()" class="h-10 w-10 flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-800 rounded transition-colors focus:outline-none flex-shrink-0">
                <svg id="toggleIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path id="togglePath" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2zM9 6v12" />
                </svg>
            </button>
            <span id="toggleText" class="ml-3 text-sm font-medium sidebar-text whitespace-nowrap text-gray-400">Collapse sidebar</span>
            <span id="tooltipText" class="tooltip">Expand sidebar ⌘B</span>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 z-10 flex-shrink-0">
            <h1 id="categoryTitle" class="text-xl font-semibold text-gray-800">Overview</h1>
            <a href="mailto:shahinkapdaghar@gmail.com" class="text-sm font-medium text-blue-600 hover:text-blue-800">Support</a>
        </header>

        <main class="flex-1 overflow-y-auto flex flex-col">
            <div class="p-4 md:p-8 flex-1">
                <div class="max-w-5xl mx-auto bg-white rounded-lg border border-gray-200 shadow-sm p-2 mb-8 flex items-center">
                    <svg class="h-5 w-5 text-gray-400 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" placeholder="Search catalog..." class="w-full ml-3 outline-none text-sm text-gray-600" onkeyup="searchProducts(this.value)">
                </div>

                <div class="max-w-5xl mx-auto bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden mb-8">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <h2 class="font-medium text-gray-800">Product List</h2>
                        <span id="productCount" class="text-xs font-medium bg-gray-200 text-gray-700 px-2 py-1 rounded-full">0 items</span>
                    </div>
                    <div id="product-grid" class="p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        <p class="text-gray-400 text-sm col-span-full">Loading catalog...</p>
                    </div>
                </div>
            </div>
            <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500 w-full mt-auto">
                <p>&copy; 2026 Shaheen Kapda Ghar. All rights reserved.</p>
            </footer>
        </main>
    </div>

    <!-- INSTAGRAM STYLE CAROUSEL MODAL -->
    <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-95 z-50 hidden flex flex-col justify-center items-center opacity-0 transition-opacity duration-300">
        <!-- Close Button -->
        <button class="absolute top-6 right-6 text-white hover:text-gray-300 z-50 p-2" onclick="closeModal()">
            <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <!-- Carousel Container -->
        <div class="relative max-w-[90vw] max-h-[80vh] flex items-center justify-center">
            <!-- Left Navigation Arrow -->
            <button id="prevBtn" onclick="prevSlide()" class="absolute left-4 bg-white/20 hover:bg-white/40 text-white rounded-full p-2 z-10 transition hidden md:block">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>

            <!-- Media Display Area -->
            <div id="carouselMediaContainer" class="flex items-center justify-center overflow-hidden rounded-lg">
                <!-- Dynamically Injected Media (Img or Video) -->
            </div>

            <!-- Right Navigation Arrow -->
            <button id="nextBtn" onclick="nextSlide()" class="absolute right-4 bg-white/20 hover:bg-white/40 text-white rounded-full p-2 z-10 transition hidden md:block">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>

        <!-- Instagram Style Three Horizontal Dots / Indicators -->
        <div id="carouselDots" class="flex items-center justify-center space-x-2 mt-4">
            <!-- Dynamic Dots -->
        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = "919999950662"; 
        let allProducts = []; 
        let currentCategory = 'All';
        
        // Carousel State Variables
        let currentMediaList = [];
        let currentIndex = 0;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const isCollapsed = sidebar.classList.toggle('sidebar-collapsed');
            const path = document.getElementById('togglePath');
            const toggleText = document.getElementById('toggleText');
            const tooltipText = document.getElementById('tooltipText');

            if (isCollapsed) {
                path.setAttribute('d', 'M4 6h16a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2zM15 6v12');
                toggleText.innerText = "Expand sidebar";
                tooltipText.innerText = "Expand sidebar ⌘B";
            } else {
                path.setAttribute('d', 'M4 6h16a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2zM9 6v12');
                toggleText.innerText = "Collapse sidebar";
                tooltipText.innerText = "Collapse sidebar ⌘B";
            }
        }

        function getInitials(name) {
            return name.split(' ').map(word => word.charAt(0).toUpperCase()).slice(0, 2).join('');
        }

        function getColor(name) {
            const colors = ['bg-red-100 text-red-600', 'bg-blue-100 text-blue-600', 'bg-green-100 text-green-600', 'bg-purple-100 text-purple-600', 'bg-yellow-100 text-yellow-700', 'bg-pink-100 text-pink-600', 'bg-indigo-100 text-indigo-600'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        }

        // --- INSTAGRAM CAROUSEL MODAL LOGIC ---
        function openCarousel(productJsonString, event) {
            event.stopPropagation();
            const product = JSON.parse(decodeURIComponent(productJsonString));
            
            // Fallback if product only has old image_url
            currentMediaList = product.media && product.media.length > 0 
                ? product.media 
                : [{ type: 'image', url: product.image_url }];
            
            currentIndex = 0;
            renderCarouselSlide();

            const modal = document.getElementById('imageModal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                // Stop any playing videos when closing
                document.getElementById('carouselMediaContainer').innerHTML = '';
            }, 300);
        }

        function renderCarouselSlide() {
            const container = document.getElementById('carouselMediaContainer');
            const dotsContainer = document.getElementById('carouselDots');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            container.innerHTML = '';
            dotsContainer.innerHTML = '';

            if (currentMediaList.length === 0) return;

            // Render current media item
            const currentItem = currentMediaList[currentIndex];
            if (currentItem.type === 'video') {
                container.innerHTML = `
                    <video src="${currentItem.url}" controls autoplay class="max-h-[80vh] max-w-[90vw] object-contain rounded-lg shadow-2xl" style="outline: none;"></video>
                `;
            } else {
                container.innerHTML = `
                    <img src="${currentItem.url}" class="max-h-[80vh] max-w-[90vw] object-contain rounded-lg shadow-2xl">
                `;
            }

            // Show/Hide navigation arrows based on count
            if (currentMediaList.length > 1) {
                prevBtn.style.display = currentIndex > 0 ? 'block' : 'none';
                nextBtn.style.display = currentIndex < currentMediaList.length - 1 ? 'block' : 'none';
            } else {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            }

            // Render Instagram-style dots indicator
            currentMediaList.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.className = `h-2 rounded-full transition-all duration-300 ${idx === currentIndex ? 'w-6 bg-white' : 'w-2 bg-white/50'}`;
                dotsContainer.appendChild(dot);
            });
        }

        function nextSlide() {
            if (currentIndex < currentMediaList.length - 1) {
                currentIndex++;
                renderCarouselSlide();
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCarouselSlide();
            }
        }

        // Keyboard navigation (Left/Right arrow keys)
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('imageModal');
            if (!modal.classList.contains('hidden')) {
                if (e.key === 'ArrowRight') nextSlide();
                if (e.key === 'ArrowLeft') prevSlide();
                if (e.key === 'Escape') closeModal();
            }
        });

        // Touch swipe support for mobile / touch devices
        let touchStartX = 0;
        document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', e => {
            const modal = document.getElementById('imageModal');
            if (!modal.classList.contains('hidden')) {
                let touchEndX = e.changedTouches[0].screenX;
                if (touchStartX - touchEndX > 50) nextSlide();
                if (touchEndX - touchStartX > 50) prevSlide();
            }
        });

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            document.getElementById('productCount').innerText = `${products.length} items`;
            grid.innerHTML = ''; 
            
            if (products.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 text-sm col-span-full py-4">No products found.</p>';
                return;
            }

            products.forEach(product => {
                const message = encodeURIComponent(`Hi Shaheen Kapda Ghar, I'm interested in the ${product.name} (Fabric: ${product.fabric}). Can you share more details?`);
                const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
                const catDisplay = product.category ? product.category : 'General';
                const mainImage = product.image_url || (product.media && product.media.length > 0 ? product.media[0].url : '');
                
                // Encode product payload for modal
                const encodedProduct = encodeURIComponent(JSON.stringify(product));
                const hasMultipleMedia = product.media && product.media.length > 1;

                const card = `
                    <div class="border border-gray-200 rounded-lg overflow-hidden bg-white hover:border-blue-400 transition-colors flex flex-col group">
                        <div class="relative aspect-[4/5] bg-gray-100 cursor-pointer overflow-hidden" onclick="openCarousel('${encodedProduct}', event)">
                            <img src="${mainImage}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://placehold.co/400x500?text=Image+Removed'">
                            
                            ${hasMultipleMedia ? `
                                <div class="absolute top-3 right-3 bg-black/60 text-white text-[10px] font-semibold px-2 py-1 rounded-full flex items-center space-x-1 backdrop-blur-sm">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                    <span>Swipe</span>
                                </div>
                            ` : ''}

                            <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 transition-all flex items-center justify-center">
                                <span class="bg-white text-black text-xs font-semibold px-3 py-1 rounded-full opacity-0 group-hover:opacity-100 transform translate-y-2 group-hover:translate-y-0 transition-all shadow">View Post</span>
                            </div>
                        </div>
                        
                        <div class="p-4 flex flex-col flex-1">
                            <div class="flex justify-between items-start mb-1">
                                <h3 class="text-sm font-semibold text-gray-900 truncate pr-2">${product.name}</h3>
                                <span class="text-xs font-semibold ${getColor(catDisplay)} px-2 py-0.5 rounded whitespace-nowrap">${catDisplay}</span>
                            </div>
                            <p class="text-xs text-gray-500 mb-3">${product.fabric}</p>
                            
                            <div class="mt-auto pt-3 border-t border-gray-100 flex items-center justify-between">
                                <p class="text-sm font-bold text-gray-900">₹${product.price}</p>
                                <a href="${waUrl}" target="_blank" class="text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded transition">
                                    WhatsApp
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function filterCategory(category) {
            currentCategory = category;
            document.getElementById('categoryTitle').innerText = category === 'All' ? 'Overview' : category;
            const filtered = category === 'All' ? allProducts : allProducts.filter(p => p.category === category);
            renderProducts(filtered);
            if (window.innerWidth < 768) toggleSidebar();
        }

        function searchProducts(query) {
            const lowerQuery = query.toLowerCase();
            let baseList = currentCategory === 'All' ? allProducts : allProducts.filter(p => p.category === currentCategory);
            const searched = baseList.filter(p => 
                p.name.toLowerCase().includes(lowerQuery) || 
                p.fabric.toLowerCase().includes(lowerQuery) ||
                p.colors.some(c => c.toLowerCase().includes(lowerQuery))
            );
            renderProducts(searched);
        }

        function createSidebarItem(name) {
            const initials = getInitials(name);
            const colorClass = getColor(name);
            return `
                <li>
                    <button onclick="filterCategory('${name}')" class="w-full flex items-center p-2 mt-1 text-sm text-gray-400 hover:bg-gray-800 hover:text-white transition rounded mx-2 cf-nav-item" style="width: calc(100% - 1rem);">
                        <div class="h-6 w-6 rounded flex items-center justify-center font-bold text-[10px] ${colorClass} flex-shrink-0">
                            ${initials}
                        </div>
                        <span class="ml-3 sidebar-text whitespace-nowrap">${name === 'All' ? 'All Products' : name}</span>
                    </button>
                </li>`;
        }

        async function init() {
            try {
                const response = await fetch('products.json');
                allProducts = await response.json();
                allProducts.reverse(); 
                
                const catList = document.getElementById('categoryList');
                catList.innerHTML = createSidebarItem('All');

                const categories = [...new Set(allProducts.map(p => p.category).filter(c => c))];
                categories.forEach(cat => {
                    catList.innerHTML += createSidebarItem(cat);
                });

                renderProducts(allProducts);
                
                if (window.innerWidth < 768) {
                    const sidebar = document.getElementById('sidebar');
                    sidebar.classList.add('sidebar-collapsed');
                    document.getElementById('togglePath').setAttribute('d', 'M4 6h16a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2zM15 6v12');
                }
            } catch (error) {
                document.getElementById('product-grid').innerHTML = '<p class="text-red-500 text-sm p-4">Error loading catalog.</p>';
            }
        }

        init();
    </script>
</body>
</html>
