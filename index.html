<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaheen Kapda Ghar | Official Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col min-h-screen relative">

    <!-- Navigation Bar -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Hamburger Menu Button -->
                <button onclick="toggleSidebar()" class="text-gray-500 hover:text-black focus:outline-none">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center justify-center flex-1">
                    <img src="https://i.ibb.co/DftDQgGM/IMG-6937.jpg" alt="Shaheen Kapda Ghar Logo" class="h-10 w-auto" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <!-- Fallback text if logo fails to load -->
                    <h1 class="text-xl font-bold tracking-widest uppercase hidden">Shaheen Kapda Ghar</h1>
                </div>
                
                <div>
                    <a href="mailto:shahinkapdaghar@gmail.com" class="text-sm text-gray-500 hover:text-black transition">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Slide-out Sidebar -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden transition-opacity" onclick="toggleSidebar()"></div>
    <div id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white z-50 transform -translate-x-full transition-transform duration-300 ease-in-out border-r border-gray-200 flex flex-col">
        <div class="flex items-center justify-between p-4 border-b">
            <span class="font-bold text-lg">Categories</span>
            <button onclick="toggleSidebar()" class="text-gray-500 hover:text-black">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <!-- Categories will be injected here by JavaScript -->
        <ul id="categoryList" class="p-4 space-y-3 flex-grow overflow-y-auto">
            <li><button onclick="filterCategory('All')" class="text-gray-600 hover:text-black w-full text-left font-medium">All Products</button></li>
        </ul>
    </div>

    <!-- Main Product Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
        <div class="flex justify-between items-end mb-8">
            <h2 id="categoryTitle" class="text-2xl font-semibold">New Arrivals</h2>
        </div>
        
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-6 gap-y-10">
            <p class="text-gray-500 col-span-full text-center py-10">Loading catalog...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto py-8 text-center text-sm text-gray-500 w-full">
        <p>&copy; 2026 Shaheen Kapda Ghar. All rights reserved.</p>
    </footer>

    <script>
        // --- YOUR WHATSAPP NUMBER ---
        const WHATSAPP_NUMBER = "919999950662"; 
        
        let allProducts = []; // Store products globally for filtering

        // Sidebar Toggle Logic
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        // Render Products Logic
        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = ''; 
            
            if (products.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-10">No products found in this category.</p>';
                return;
            }

            products.forEach(product => {
                const message = encodeURIComponent(`Hi Shaheen Kapda Ghar, I'm interested in the ${product.name} (Fabric: ${product.fabric}). Can you share more details?`);
                const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
                // Handle older products that might not have a category field yet
                const catDisplay = product.category ? `<span class="inline-block bg-gray-100 rounded-full px-2 py-1 text-[10px] font-semibold text-gray-600 mb-2">${product.category}</span>` : '';

                const card = `
                    <div class="group relative flex flex-col bg-white rounded-lg shadow-sm hover:shadow-md transition duration-300 overflow-hidden">
                        <div class="aspect-w-3 aspect-h-4 bg-gray-200 group-hover:opacity-75 transition">
                            <img src="${product.image_url}" alt="${product.name}" class="w-full h-80 object-cover object-center">
                        </div>
                        <div class="p-4 flex-1 flex flex-col">
                            ${catDisplay}
                            <h3 class="text-sm font-medium text-gray-900 mb-1">${product.name}</h3>
                            <p class="text-xs text-gray-500 mb-2">${product.fabric}</p>
                            <p class="text-xs text-gray-500 mb-4">Colors: ${product.colors.join(', ')}</p>
                            
                            <div class="mt-auto flex items-center justify-between">
                                <p class="text-sm font-semibold text-gray-900">₹${product.price}</p>
                                <a href="${waUrl}" target="_blank" class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-xs font-medium rounded shadow-sm text-white bg-green-600 hover:bg-green-700 transition z-10 relative">
                                    Enquire via WhatsApp
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // Filter Logic
        function filterCategory(category) {
            document.getElementById('categoryTitle').innerText = category === 'All' ? 'New Arrivals' : category;
            
            if (category === 'All') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === category);
                renderProducts(filtered);
            }
            toggleSidebar(); // Close sidebar after selecting
        }

        // Initialize App
        async function init() {
            try {
                const response = await fetch('products.json');
                allProducts = await response.json();
                allProducts.reverse(); 
                
                // Extract unique categories to build sidebar menu
                const categories = [...new Set(allProducts.map(p => p.category).filter(c => c))];
                const catList = document.getElementById('categoryList');
                categories.forEach(cat => {
                    catList.innerHTML += `<li><button onclick="filterCategory('${cat}')" class="text-gray-600 hover:text-black w-full text-left">${cat}</button></li>`;
                });

                renderProducts(allProducts);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('product-grid').innerHTML = '<p class="text-red-500 col-span-full text-center py-10">Unable to load catalog.</p>';
            }
        }

        init();
    </script>
</body>
</html>
