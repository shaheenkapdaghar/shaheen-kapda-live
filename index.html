<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaheen Kapda Ghar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
        /* Custom scrollbar to match Cloudflare's clean look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body class="text-gray-800 flex h-screen overflow-hidden">

    <!-- Left Persistent Sidebar (Cloudflare Style) -->
    <aside id="sidebar" class="w-16 md:w-64 bg-white border-r border-gray-200 flex flex-col transition-all duration-300 z-20 flex-shrink-0">
        <!-- Top Logo Area -->
        <div class="h-16 flex items-center justify-center md:justify-start md:px-6 border-b border-gray-200">
            <img src="https://i.ibb.co/DftDQgGM/IMG-6937.jpg" alt="Logo" class="h-8 w-8 rounded bg-black">
            <span class="ml-3 font-semibold text-sm hidden md:block truncate">Shaheen Kapda Ghar</span>
        </div>
        
        <!-- Category Navigation -->
        <nav class="flex-1 overflow-y-auto py-4">
            <p class="px-6 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 hidden md:block">Categories</p>
            <ul id="categoryList" class="space-y-1">
                <!-- 'All Products' Default Button -->
                <li>
                    <button onclick="filterCategory('All')" class="w-full flex items-center px-4 md:px-6 py-2 text-sm text-gray-600 hover:bg-gray-50 hover:text-black transition">
                        <svg class="h-5 w-5 text-gray-400 md:mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                        </svg>
                        <span class="hidden md:block">All Products</span>
                    </button>
                </li>
                <!-- Dynamic categories inject here -->
            </ul>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Top Header Bar -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 z-10 flex-shrink-0">
            <div class="flex items-center flex-1">
                <!-- Mobile Hamburger -->
                <button onclick="toggleMobileSidebar()" class="md:hidden mr-4 text-gray-500 hover:text-black">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <h1 id="categoryTitle" class="text-xl font-semibold text-gray-800">Overview</h1>
            </div>
            <div>
                <a href="mailto:shahinkapdaghar@gmail.com" class="text-sm font-medium text-blue-600 hover:text-blue-800">Support</a>
            </div>
        </header>

        <!-- Scrollable Content Container -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <!-- Cloudflare Style "Hero" Search Bar (Aesthetic) -->
            <div class="max-w-5xl mx-auto bg-white rounded-lg border border-gray-200 shadow-sm p-2 mb-8 flex items-center">
                <svg class="h-5 w-5 text-gray-400 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" placeholder="Search catalog..." class="w-full ml-3 outline-none text-sm text-gray-600" onkeyup="searchProducts(this.value)">
            </div>

            <!-- Product Grid inside a Cloudflare-style Card -->
            <div class="max-w-5xl mx-auto bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="font-medium text-gray-800">Product List</h2>
                    <span id="productCount" class="text-xs font-medium bg-gray-100 text-gray-600 px-2 py-1 rounded-full">0 items</span>
                </div>
                
                <div id="product-grid" class="p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <p class="text-gray-400 text-sm col-span-full">Loading catalog...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- FULL SCREEN IMAGE POPUP (MODAL) -->
    <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-90 z-50 hidden flex justify-center items-center opacity-0 transition-opacity duration-300" onclick="closeImage()">
        <button class="absolute top-6 right-6 text-white hover:text-gray-300" onclick="closeImage()">
            <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        <img id="expandedImg" src="" class="max-h-[90vh] max-w-[90vw] object-contain rounded-lg shadow-2xl transform scale-95 transition-transform duration-300">
    </div>

    <script>
        const WHATSAPP_NUMBER = "919999950662"; 
        let allProducts = []; 
        let currentCategory = 'All';

        // Mobile Sidebar Toggle
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('w-16')) {
                sidebar.classList.remove('w-16');
                sidebar.classList.add('w-64');
            } else {
                sidebar.classList.add('w-16');
                sidebar.classList.remove('w-64');
            }
        }

        // Image Popup Logic
        function openImage(url, event) {
            event.stopPropagation(); // Prevents clicking the image from triggering parent clicks
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('expandedImg');
            img.src = url;
            modal.classList.remove('hidden');
            // Tiny delay to allow display:block to apply before animating opacity
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                img.classList.remove('scale-95');
            }, 10);
        }

        function closeImage() {
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('expandedImg');
            modal.classList.add('opacity-0');
            img.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300); // Matches transition duration
        }

        // Render Products
        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            document.getElementById('productCount').innerText = `${products.length} items`;
            grid.innerHTML = ''; 
            
            if (products.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 text-sm col-span-full py-4">No products found.</p>';
                return;
            }

            products.forEach(product => {
                const message = encodeURIComponent(`Hi Shaheen Kapda Ghar, I'm interested in the ${product.name} (Fabric: ${product.fabric}). Can you share more details?`);
                const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
                const catDisplay = product.category ? product.category : 'General';

                // Card uses Cloudflare's subtle gray borders and small text
                const card = `
                    <div class="border border-gray-200 rounded-lg overflow-hidden bg-white hover:border-blue-400 transition-colors flex flex-col group">
                        <!-- Clickable Image Area -->
                        <div class="relative aspect-[4/5] bg-gray-100 cursor-pointer overflow-hidden" onclick="openImage('${product.image_url}', event)">
                            <img src="${product.image_url}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://placehold.co/400x500?text=Image+Removed'">
                            <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 transition-all flex items-center justify-center">
                                <span class="bg-white text-black text-xs font-semibold px-3 py-1 rounded-full opacity-0 group-hover:opacity-100 transform translate-y-2 group-hover:translate-y-0 transition-all">Click to Expand</span>
                            </div>
                        </div>
                        
                        <!-- Content Area -->
                        <div class="p-4 flex flex-col flex-1">
                            <div class="flex justify-between items-start mb-1">
                                <h3 class="text-sm font-semibold text-gray-900 truncate pr-2">${product.name}</h3>
                                <span class="text-xs text-gray-500 bg-gray-100 px-2 py-0.5 rounded border border-gray-200 whitespace-nowrap">${catDisplay}</span>
                            </div>
                            <p class="text-xs text-gray-500 mb-3">${product.fabric}</p>
                            
                            <div class="mt-auto pt-3 border-t border-gray-100 flex items-center justify-between">
                                <p class="text-sm font-bold text-gray-900">₹${product.price}</p>
                                <a href="${waUrl}" target="_blank" class="text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded transition">
                                    WhatsApp
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // Sidebar Filtering
        function filterCategory(category) {
            currentCategory = category;
            document.getElementById('categoryTitle').innerText = category === 'All' ? 'Overview' : category;
            
            const filtered = category === 'All' ? allProducts : allProducts.filter(p => p.category === category);
            renderProducts(filtered);
            
            // Close sidebar on mobile after clicking
            if (window.innerWidth < 768) toggleMobileSidebar();
        }

        // Search Box Logic
        function searchProducts(query) {
            const lowerQuery = query.toLowerCase();
            let baseList = currentCategory === 'All' ? allProducts : allProducts.filter(p => p.category === currentCategory);
            
            const searched = baseList.filter(p => 
                p.name.toLowerCase().includes(lowerQuery) || 
                p.fabric.toLowerCase().includes(lowerQuery) ||
                p.colors.some(c => c.toLowerCase().includes(lowerQuery))
            );
            renderProducts(searched);
        }

        // Initialize
        async function init() {
            try {
                const response = await fetch('products.json');
                allProducts = await response.json();
                allProducts.reverse(); 
                
                // Build sidebar categories
                const categories = [...new Set(allProducts.map(p => p.category).filter(c => c))];
                const catList = document.getElementById('categoryList');
                
                categories.forEach(cat => {
                    // SVG Icon (Folder)
                    const icon = `<svg class="h-5 w-5 text-gray-400 md:mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" /></svg>`;
                    catList.innerHTML += `
                        <li>
                            <button onclick="filterCategory('${cat}')" class="w-full flex items-center px-4 md:px-6 py-2 text-sm text-gray-600 hover:bg-gray-50 hover:text-black transition">
                                ${icon}
                                <span class="hidden md:block">${cat}</span>
                            </button>
                        </li>`;
                });

                renderProducts(allProducts);
            } catch (error) {
                document.getElementById('product-grid').innerHTML = '<p class="text-red-500 text-sm p-4">Error loading catalog.</p>';
            }
        }

        init();
    </script>
</body>
</html>
