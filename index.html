<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaheen Kapda Ghar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        /* Cloudflare Sidebar Animation CSS */
        #sidebar {
            width: 16rem; /* 256px open */
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #sidebar.sidebar-collapsed {
            width: 4rem; /* 64px closed */
        }
        /* Instantly hide text to prevent ugly wrapping during animation */
        #sidebar.sidebar-collapsed .sidebar-text {
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }
        #sidebar:not(.sidebar-collapsed) .sidebar-text {
            opacity: 1;
            transition: opacity 0.2s ease-in 0.1s; /* fade in slightly after width expands */
        }
        
        /* Center elements when collapsed */
        #sidebar.sidebar-collapsed .cf-nav-item {
            justify-content: center;
            padding-left: 0;
            padding-right: 0;
        }
        #sidebar.sidebar-collapsed .logo-container {
            justify-content: center;
        }
        
        /* Pitch Black Override */
        .bg-cf-black { background-color: #000000; }
        .border-cf-dark { border-color: #333333; }
    </style>
</head>
<body class="text-gray-800 flex h-screen overflow-hidden">

    <!-- Left Persistent Sidebar (PITCH BLACK) -->
    <aside id="sidebar" class="bg-cf-black border-r border-cf-dark flex flex-col z-20 flex-shrink-0 text-white relative">
        
        <!-- Top Logo Area -->
        <div class="h-16 flex items-center px-5 border-b border-cf-dark logo-container transition-all duration-300">
            <img src="https://i.ibb.co/DftDQgGM/IMG-6937.jpg" alt="Logo" class="h-8 w-8 rounded flex-shrink-0 bg-white">
            <!-- Text fades out and positions absolutely when closed -->
            <span class="ml-3 font-semibold text-sm sidebar-text whitespace-nowrap overflow-hidden">Shaheen Kapda Ghar</span>
        </div>
        
        <!-- Category Navigation -->
        <nav class="flex-1 overflow-y-auto py-4 overflow-x-hidden">
            <p class="px-5 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 sidebar-text">Categories</p>
            <ul id="categoryList" class="space-y-1">
                <!-- Dynamic categories inject here -->
            </ul>
        </nav>

        <!-- Bottom Toggle Button (Cloudflare Style) -->
        <div class="border-t border-cf-dark p-2">
            <button onclick="toggleSidebar()" class="w-full flex items-center p-3 text-gray-400 hover:text-white hover:bg-gray-800 rounded transition-colors cf-nav-item">
                <!-- Hamburger Icon -->
                <svg class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <span class="ml-3 text-sm font-medium sidebar-text whitespace-nowrap">Collapse menu</span>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Top Header Bar -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 z-10 flex-shrink-0">
            <div class="flex items-center flex-1">
                <h1 id="categoryTitle" class="text-xl font-semibold text-gray-800">Overview</h1>
            </div>
            <div>
                <a href="mailto:shahinkapdaghar@gmail.com" class="text-sm font-medium text-blue-600 hover:text-blue-800">Support</a>
            </div>
        </header>

        <!-- Scrollable Content Container -->
        <main class="flex-1 overflow-y-auto flex flex-col">
            <div class="p-4 md:p-8 flex-1">
                <!-- Search Bar -->
                <div class="max-w-5xl mx-auto bg-white rounded-lg border border-gray-200 shadow-sm p-2 mb-8 flex items-center focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 transition-all">
                    <svg class="h-5 w-5 text-gray-400 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" placeholder="Search catalog..." class="w-full ml-3 outline-none text-sm text-gray-600" onkeyup="searchProducts(this.value)">
                </div>

                <!-- Product Grid -->
                <div class="max-w-5xl mx-auto bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden mb-8">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <h2 class="font-medium text-gray-800">Product List</h2>
                        <span id="productCount" class="text-xs font-medium bg-gray-200 text-gray-700 px-2 py-1 rounded-full">0 items</span>
                    </div>
                    
                    <div id="product-grid" class="p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        <p class="text-gray-400 text-sm col-span-full">Loading catalog...</p>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500 w-full mt-auto">
                <p>&copy; 2026 Shaheen Kapda Ghar. All rights reserved.</p>
            </footer>
        </main>
    </div>

    <!-- FULL SCREEN IMAGE POPUP (MODAL) -->
    <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-90 z-50 hidden flex justify-center items-center opacity-0 transition-opacity duration-300" onclick="closeImage()">
        <button class="absolute top-6 right-6 text-white hover:text-gray-300" onclick="closeImage()">
            <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        <img id="expandedImg" src="" class="max-h-[90vh] max-w-[90vw] object-contain rounded-lg shadow-2xl transform scale-95 transition-transform duration-300">
    </div>

    <script>
        const WHATSAPP_NUMBER = "919999950662"; 
        let allProducts = []; 
        let currentCategory = 'All';

        // Sidebar Toggle Logic
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('sidebar-collapsed');
        }

        function getInitials(name) {
            return name.split(' ').map(word => word.charAt(0).toUpperCase()).slice(0, 2).join('');
        }

        function getColor(name) {
            const colors = ['bg-red-100 text-red-600', 'bg-blue-100 text-blue-600', 'bg-green-100 text-green-600', 'bg-purple-100 text-purple-600', 'bg-yellow-100 text-yellow-700', 'bg-pink-100 text-pink-600', 'bg-indigo-100 text-indigo-600'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        }

        function openImage(url, event) {
            event.stopPropagation();
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('expandedImg');
            img.src = url;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                img.classList.remove('scale-95');
            }, 10);
        }

        function closeImage() {
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('expandedImg');
            modal.classList.add('opacity-0');
            img.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            document.getElementById('productCount').innerText = `${products.length} items`;
            grid.innerHTML = ''; 
            
            if (products.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 text-sm col-span-full py-4">No products found.</p>';
                return;
            }

            products.forEach(product => {
                const message = encodeURIComponent(`Hi Shaheen Kapda Ghar, I'm interested in the ${product.name} (Fabric: ${product.fabric}). Can you share more details?`);
                const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
                const catDisplay = product.category ? product.category : 'General';

                const card = `
                    <div class="border border-gray-200 rounded-lg overflow-hidden bg-white hover:border-blue-400 transition-colors flex flex-col group">
                        <div class="relative aspect-[4/5] bg-gray-100 cursor-pointer overflow-hidden" onclick="openImage('${product.image_url}', event)">
                            <img src="${product.image_url}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://placehold.co/400x500?text=Image+Removed'">
                            <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 transition-all flex items-center justify-center">
                                <span class="bg-white text-black text-xs font-semibold px-3 py-1 rounded-full opacity-0 group-hover:opacity-100 transform translate-y-2 group-hover:translate-y-0 transition-all">Click to Expand</span>
                            </div>
                        </div>
                        
                        <div class="p-4 flex flex-col flex-1">
                            <div class="flex justify-between items-start mb-1">
                                <h3 class="text-sm font-semibold text-gray-900 truncate pr-2">${product.name}</h3>
                                <span class="text-xs font-semibold ${getColor(catDisplay)} px-2 py-0.5 rounded whitespace-nowrap">${catDisplay}</span>
                            </div>
                            <p class="text-xs text-gray-500 mb-3">${product.fabric}</p>
                            
                            <div class="mt-auto pt-3 border-t border-gray-100 flex items-center justify-between">
                                <p class="text-sm font-bold text-gray-900">₹${product.price}</p>
                                <a href="${waUrl}" target="_blank" class="text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded transition">
                                    WhatsApp
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function filterCategory(category) {
            currentCategory = category;
            document.getElementById('categoryTitle').innerText = category === 'All' ? 'Overview' : category;
            
            const filtered = category === 'All' ? allProducts : allProducts.filter(p => p.category === category);
            renderProducts(filtered);
            
            // On mobile, auto-collapse after picking a category
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('sidebar-collapsed');
            }
        }

        function searchProducts(query) {
            const lowerQuery = query.toLowerCase();
            let baseList = currentCategory === 'All' ? allProducts : allProducts.filter(p => p.category === currentCategory);
            
            const searched = baseList.filter(p => 
                p.name.toLowerCase().includes(lowerQuery) || 
                p.fabric.toLowerCase().includes(lowerQuery) ||
                p.colors.some(c => c.toLowerCase().includes(lowerQuery))
            );
            renderProducts(searched);
        }

        function createSidebarItem(name) {
            const initials = getInitials(name);
            const colorClass = getColor(name);
            
            return `
                <li>
                    <button onclick="filterCategory('${name}')" class="w-full flex items-center p-3 text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition rounded mx-2 cf-nav-item" style="width: calc(100% - 1rem);">
                        <div class="h-6 w-6 rounded flex items-center justify-center font-bold text-[10px] ${colorClass} flex-shrink-0">
                            ${initials}
                        </div>
                        <span class="ml-3 sidebar-text whitespace-nowrap">${name === 'All' ? 'All Products' : name}</span>
                    </button>
                </li>`;
        }

        async function init() {
            try {
                const response = await fetch('products.json');
                allProducts = await response.json();
                allProducts.reverse(); 
                
                const catList = document.getElementById('categoryList');
                
                catList.innerHTML = createSidebarItem('All');

                const categories = [...new Set(allProducts.map(p => p.category).filter(c => c))];
                categories.forEach(cat => {
                    catList.innerHTML += createSidebarItem(cat);
                });

                renderProducts(allProducts);
                
                // Start collapsed on mobile
                if (window.innerWidth < 768) {
                    document.getElementById('sidebar').classList.add('sidebar-collapsed');
                }
            } catch (error) {
                document.getElementById('product-grid').innerHTML = '<p class="text-red-500 text-sm p-4">Error loading catalog.</p>';
            }
        }

        init();
    </script>
</body>
</html>
